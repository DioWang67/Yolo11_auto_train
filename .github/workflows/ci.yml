name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"

jobs:
  quality:
    name: Blocking quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements/requirements-quality.txt
            pyproject.toml
      - name: Install quality tools
        run: python -m pip install --requirement requirements/requirements-quality.txt
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Lint
        run: python -m ruff check src tests
      - name: Type-check
        run: python -m mypy src/picture_tool

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: windows-latest
            python: "3.11"
    env:
      PYTHONPATH: src
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements/requirements-dev.txt
            requirements/constraints-ci-py310.txt
            pyproject.toml
      - name: Install locked dependencies
        if: matrix.python == '3.11'
        run: python -m pip install --requirement requirements/requirements-dev.txt
      - name: Resolve Python 3.10 compatible dependencies
        if: matrix.python == '3.10'
        run: python -m pip install --constraint requirements/constraints-ci-py310.txt --editable ".[gui,dev]"
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Verify supported runtime
        run: python -m picture_tool.doctor --runtime-only
      - name: Run tests
        run: |
          python -c "from pathlib import Path; Path('reports').mkdir(exist_ok=True)"
          python -m pytest --ignore=src/picture_tool/libs/labelImg --junitxml=reports/junit.xml --timeout=60
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ runner.os }}-py${{ matrix.python }}
          path: reports/junit.xml
          if-no-files-found: warn
          retention-days: 14

  coverage:
    name: Coverage gates
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: src
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements/requirements-dev.txt
            pyproject.toml
      - name: Install development dependencies
        run: python -m pip install --requirement requirements/requirements-dev.txt
      - name: Verify supported runtime
        run: python -m picture_tool.doctor --runtime-only
      - name: Run tests with project-wide coverage
        run: |
          python -c "from pathlib import Path; Path('reports').mkdir(exist_ok=True)"
          python -m pytest \
            --ignore=src/picture_tool/libs/labelImg \
            --cov=picture_tool \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=term-missing \
            --junitxml=reports/coverage-junit.xml \
            --timeout=60
      - name: Enforce 80 percent project-wide coverage
        run: python -m coverage report --fail-under=80
      - name: Enforce 80 percent on critical workflows
        run: |
          python -m coverage report \
            --include="*operator_acceptance.py,*path_resolver.py,*pending_annotations.py,*runtime_pair_deployment.py,*workspace_paths.py,*position_gate.py,*dataset_readiness.py,*operator_dataset_conflicts.py,*quality_schemas.py,*detection_config.py,*model_manager.py,*normalization.py" \
            --fail-under=80
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: |
            reports/coverage.xml
            reports/coverage-junit.xml
          if-no-files-found: warn
          retention-days: 14

  package:
    name: Build package
    needs: [tests, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install build tooling
        run: python -m pip install build==1.3.0 twine==7.0.0
      - name: Build and smoke-test wheel
        run: |
          python -m build
          python -m twine check dist/*
          python -m pip install --no-deps --force-reinstall dist/*.whl
          python -c "import picture_tool; print(picture_tool.__file__)"
      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: picture-tool-package
          path: dist/
          if-no-files-found: error
          retention-days: 14
